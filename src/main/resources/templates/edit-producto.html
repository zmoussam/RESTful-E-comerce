<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Editar Producto</h1>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <form th:action="@{/productos/edit/{id}(id=${producto.id})}" th:object="${producto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre del Producto</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Precio</label>
                    <input type="number" id="price" th:field="*{price}" class="form-control" step="0.01" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Actualizar Producto</button>
            </form>

            <a href="/admin" class="btn btn-secondary w-100 mt-3">Volver al Panel Admin</a>
        </div>
    </div>
</div>
</body>
</html>
