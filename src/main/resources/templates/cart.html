<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Google Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <title>Carrito de Compras</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Flash message styling */
      .flash-message {
        position: fixed;
        top: 70px;
        right: 20px;
        z-index: 9999;
        min-width: 250px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-light bg-light shadow-sm mb-4 rounded">
        <div
          class="container d-flex justify-content-between align-items-center"
        >
          <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="material-icons me-2 text-primary">home</span>
            <span class="fw-bold fs-5">MyStore</span>
          </a>

          <div class="d-flex align-items-center">
            <a
              href="/admin"
              class="btn btn-warning d-inline-flex align-items-center"
            >
              <span class="material-icons me-1">admin_panel_settings</span>
              <span>Admin</span>
            </a>
          </div>
        </div>
      </nav>

      <h1 class="text-center my-5">Carrito de Compras</h1>

      <!-- Flash Message -->
      <div
        th:if="${msg}"
        class="alert alert-danger flash-message"
        th:text="${msg}"
      ></div>

      <div class="mb-4">
        <a href="/productos" class="btn btn-secondary">Continuar Comprando</a>
      </div>

      <div>
        <ul class="list-group">
          <li
            th:each="product : ${cartItems}"
            class="list-group-item d-flex justify-content-between align-items-center"
          >
            <span th:text="${product.name}">Nombre del Producto</span>
            <span th:text="${product.price}">Precio del Producto</span>
            <form
              th:action="@{/cart/remove/{id}(id=${product.id})}"
              method="post"
            >
              <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
              />
              <button type="submit" class="btn btn-danger">Eliminar</button>
            </form>
          </li>
        </ul>
      </div>
    </div>

    <!-- Auto-hide flash message after 3 seconds -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const flash = document.querySelector(".flash-message");
        if (flash) {
          setTimeout(() => {
            flash.style.display = "none";
          }, 1000);
        }
      });
    </script>
  </body>
</html>
