<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Google Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <title>Catálogo de Productos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .flash-message {
        position: fixed; /* floats above other content */
        top: 70px; /* distance from top */
        right: 20px; /* distance from right */
        z-index: 9999; /* ensures it is on top */
        min-width: 250px; /* optional width */
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->
      <nav class="navbar navbar-light bg-light shadow-sm mb-4 rounded">
        <div
          class="container d-flex justify-content-between align-items-center"
        >
          <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="material-icons me-2 text-primary">home</span>
            <span class="fw-bold fs-5">MyStore</span>
          </a>

          <div class="d-flex align-items-center">
            <a
              href="/cart"
              class="btn btn-outline-primary me-2 d-inline-flex align-items-center"
            >
              <span class="material-icons me-1">shopping_cart</span>
              <span>View Cart</span>
            </a>
            <a
              href="/admin"
              class="btn btn-warning d-inline-flex align-items-center"
            >
              <span class="material-icons me-1">admin_panel_settings</span>
              <span>Admin</span>
            </a>
          </div>
        </div>
      </nav>
      <form class="d-flex mb-4" method="get" action="/productos">
        <input
          type="text"
          name="search"
          class="form-control me-2"
          placeholder="Buscar producto..."
          th:value="${search}"
        />
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>

      <div class="container mt-3">
        <div
          id="flash-msg"
          th:if="${msg}"
          class="alert alert-success flash-message"
          th:text="${msg}"
        ></div>
      </div>
      <h1 class="text-center my-4">Catálogo de Productos</h1>

      <!-- Product Cards -->
      <div class="row">
        <div th:each="product : ${products}" class="col-md-4">
          <div class="card mb-4">
            <div class="card-body text-center">
              <h5 class="card-title" th:text="${product.name}">
                Nombre del Producto
              </h5>
              <p class="card-text" th:text="'Precio: $' + ${product.price}">
                Precio
              </p>

              <!-- Add to Cart button -->
              <div class="text-center mt-3">
                <form
                  th:action="@{/cart/add/{id}(id=${product.id})}"
                  method="post"
                >
                  <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                  />
                  <button type="submit" class="btn btn-success">
                    Agregar al Carrito
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("DOMContentLoaded", (event) => {
        const flash = document.getElementById("flash-msg");
        if (flash) {
          setTimeout(() => {
            flash.style.display = "none";
          }, 1000); // 3000 ms = 3 seconds
        }
      });
    </script>
  </body>
</html>
