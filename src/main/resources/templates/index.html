<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Google Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <title>Welcome to Our Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->
      <nav class="navbar navbar-light bg-light shadow-sm mb-4 rounded">
        <div
          class="container d-flex justify-content-between align-items-center"
        >
          <!-- Brand -->
          <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="material-icons me-2 text-primary">home</span>
            <span class="fw-bold fs-5">MyStore</span>
          </a>

          <!-- Buttons -->
          <div class="d-flex align-items-center">
            <a
              href="/cart"
              class="btn btn-outline-primary me-2 d-inline-flex align-items-center"
            >
              <span class="material-icons me-1">shopping_cart</span>
              <span>View Cart</span>
            </a>
            <a
              href="/admin"
              class="btn btn-warning d-inline-flex align-items-center"
            >
              <span class="material-icons me-1">admin_panel_settings</span>
              <span>Admin</span>
            </a>
          </div>
        </div>
      </nav>

      <!-- Introduction Section -->
      <div class="text-center my-5">
        <h1>Welcome to Our Online Store!</h1>
        <p class="lead">
          Explore a wide variety of products and enjoy a seamless shopping
          experience.
        </p>
        <a href="/productos" class="btn btn-primary btn-lg mt-3"
          >See All Products</a
        >
      </div>
    </div>
  </body>
</html>
