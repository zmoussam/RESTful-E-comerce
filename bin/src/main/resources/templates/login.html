<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
      /* Basic reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Arial", sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f4;
      }

      .container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 350px;
        text-align: center;
      }

      h1 {
        margin-bottom: 25px;
        color: #333;
        font-size: 28px;
      }

      label {
        display: block;
        text-align: left;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #2575fc;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #1a5cd6;
      }

      .forgot {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #2575fc;
        text-decoration: none;
      }

      .forgot:hover {
        text-decoration: underline;
      }

      /* Flash / error messages */
      .alert {
        padding: 10px 15px;
        margin-bottom: 20px;
        border-radius: 6px;
        font-size: 14px;
      }

      .alert-danger {
        background-color: #f8d7da;
        color: #842029;
      }

      .alert-warning {
        background-color: #fff3cd;
        color: #664d03;
      }

      .text-center {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Admin Login</h1>

      <!-- Error / Forbidden Messages -->
      <div th:if="${param.error}" class="alert alert-danger text-center">
        Invalid username or password.
      </div>

      <div th:if="${param.forbidden}" class="alert alert-warning text-center">
        You do not have permission to access that page.
      </div>

      <form th:action="@{/login}" method="post">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit">Login</button>
      </form>
      <!-- Optional: forgot password link -->
      <!-- <a href="#" class="forgot">Forgot password?</a> -->
    </div>
  </body>
</html>
