<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .error-container h1 {
            font-size: 6rem;
            color: #dc3545;
        }
        .error-container h2 {
            margin-bottom: 20px;
        }
        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 th:text="${status} ?: 'Oops!'">Error</h1>
        <h2 th:text="${error} ?: 'Something went wrong.'">Something went wrong.</h2>
        <p th:text="${message} ?: 'The page you are looking for does not exist.'">Error description</p>
        <a href="/" class="btn btn-primary btn-home">Go Back Home</a>
    </div>
</body>
</html>
