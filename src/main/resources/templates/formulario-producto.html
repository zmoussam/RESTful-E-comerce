<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Administración de Productos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <style>
      /* Flash message styling */
      .flash-message {
        position: fixed;
        top: 70px;
        right: 20px;
        z-index: 9999;
        min-width: 250px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Navbar con ícono de inicio -->
      <nav class="navbar navbar-light bg-light shadow-sm mb-4 rounded">
        <div
          class="container d-flex justify-content-between align-items-center"
        >
          <!-- Home -->
          <a class="navbar-brand d-flex align-items-center" href="/index">
            <span class="material-icons me-2 text-primary">home</span>
            <span class="fw-bold fs-5">Admin Panel</span>
          </a>

          <!-- Buttons -->
          <div class="d-flex align-items-center">
            <!-- View Products -->
            <a
              href="/productos"
              class="btn btn-outline-primary me-2 d-inline-flex align-items-center"
            >
              <span class="material-icons me-1">inventory_2</span>
              <span>Ver Catálogo</span>
            </a>

            <!-- Logout -->
            <form
              th:action="@{/logout}"
              method="post"
              class="d-inline-flex align-items-center"
            >
              <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}"
              />
              <button
                type="submit"
                class="btn btn-danger d-inline-flex align-items-center"
              >
                <span class="material-icons me-1">logout</span>
                <span>Salir</span>
              </button>
            </form>
          </div>
        </div>
      </nav>

      <!-- Flash Message Placeholder -->
      <div
        th:if="${msg}"
        class="alert alert-danger flash-message"
        th:text="${msg}"
      ></div>

      <!-- Título Principal -->
      <h1 class="text-center mb-5">Administrar Productos</h1>

      <!-- Formulario para Agregar Producto -->
      <div class="row mb-5">
        <div class="col-md-8 mx-auto">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">Agregar Nuevo Producto</h5>
            </div>
            <div class="card-body">
              <form th:action="@{/productos/add}" method="post">
                <input
                  type="hidden"
                  th:name="${_csrf.parameterName}"
                  th:value="${_csrf.token}"
                />
                <div class="mb-3">
                  <label for="name" class="form-label"
                    >Nombre del Producto</label
                  >
                  <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Nombre del producto"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="price" class="form-label">Precio</label>
                  <input
                    type="number"
                    id="price"
                    name="price"
                    class="form-control"
                    placeholder="Precio"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Agregar Producto
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!-- Lista de Productos Existentes -->
      <div class="row">
        <div class="col-md-8 mx-auto">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title mb-0">Productos Existentes</h5>
            </div>
            <ul class="list-group list-group-flush">
              <li th:each="product : ${productos}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <strong th:text="${product.name}"
                      >Nombre del Producto</strong
                    >
                    <p class="mb-0 text-muted" th:text="'$' + ${product.price}">
                      Precio del Producto
                    </p>
                  </div>
                  <div>
                    <a
                      th:href="@{/productos/edit/{id}(id=${product.id})}"
                      class="btn btn-warning"
                      >Editar</a
                    >
                    <form
                      th:action="@{/productos/delete/{id}(id=${product.id})}"
                      method="post"
                      class="d-inline-block"
                    >
                      <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                      />
                      <button type="submit" class="btn btn-danger btn-sm">
                        Eliminar
                      </button>
                    </form>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Script to auto-hide flash messages -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const flash = document.getElementById("flash-msg");
        if (flash) {
          setTimeout(() => {
            flash.style.display = "none";
          }, 3000); // hide after 3 seconds
        }
      });
    </script>
  </body>
</html>
